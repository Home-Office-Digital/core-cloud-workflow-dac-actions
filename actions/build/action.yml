name: Node npm build and upload Pages artifact
description: "Run npm build on the project after dependencies have been installed."

inputs:
  working_directory:
    description: "Directory to run npm build in (default: repository root)"
    required: false
    type: string
    default: "."

  path:
    description: "Path to the built site to upload as a Pages artifact (default: _site)"
    required: false
    type: string
    default: "_site"

  repo_name:
    description: "Repository name to use in generated DAC links and GitHub Pages paths"
    required: false
    type: string
    default: ""

  repo_owner:
    description: "Repository owner to use in generated DAC links and GitHub Pages URLs"
    required: false
    type: string
    default: ""

runs:
  using: "composite"

  steps:
    - name: Copy dac configs
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working_directory }}
      run: |
        cp -r -- "$GITHUB_ACTION_PATH/../../dac-configs/." "$WORKING_DIRECTORY"

    - name: Build Node project
      uses: Home-Office-Digital/core-cloud-workflow-node-npm-actions/actions/build@1.3.1
      env:
        REPO_NAME: ${{ inputs.repo_name }}
        REPO_OWNER: ${{ inputs.repo_owner }}
      with:
        working_directory: ${{ inputs.working_directory }}

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ inputs.path }}
