name: Node npm build and upload Pages artifact
description: "Run npm build on the project after dependencies have been installed."

inputs:
  working_directory:
    description: "Directory to run npm build in (default: repository root)"
    required: false
    type: string
    default: "."

  path:
    description: "Path to the built site to upload as a Pages artifact (default: _site)"
    required: false
    type: string
    default: "_site"

runs:
  using: "composite"

  steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        repository: Home-Office-Digital/core-cloud-workflow-dac-actions
        ref: feature/CCL-10369
        path: _workflow-actions

    - name: Copy dac configs
      shell: bash
      run: |
        cp -r _workflow-actions/dac-configs/. ${{ inputs.working_directory }}

    - name: Build Node project
      uses: Home-Office-Digital/core-cloud-workflow-node-npm-actions/actions/build@1.3.1
      with:
        working_directory: ${{ inputs.working_directory }}

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ inputs.path }}
