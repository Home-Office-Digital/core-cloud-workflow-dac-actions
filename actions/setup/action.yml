name: Setup Node and Pages
description: "Set up Node.js environment and install dependencies."

inputs:
  working_directory:
    description: "Directory to run npm audit in (default: repository root)"
    required: false
    type: string
    default: "."

  node_version:
    description: "Node version to install (e.g., 24)"
    required: false
    type: string
    default: "24"

runs:
  using: "composite"

  steps:
    - name: Copy npm files
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working_directory }}
      run: |
        cp -- "$GITHUB_ACTION_PATH/../../dac-configs/package.json" "$WORKING_DIRECTORY"
        cp -- "$GITHUB_ACTION_PATH/../../dac-configs/package-lock.json" "$WORKING_DIRECTORY"

    - name: Setup Node
      uses: Home-Office-Digital/core-cloud-workflow-node-npm-actions/actions/setup@1.3.1
      with:
        working_directory: ${{ inputs.working_directory }}
        node_version: ${{ inputs.node_version }}

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5