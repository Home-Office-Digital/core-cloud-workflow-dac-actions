# SonarQube configuration for this repository
# Exclude test fixtures and example code from analysis.
sonar.exclusions=tests/**

# Exclude presentation/config glue from the coverage requirement. These are the
# shared docs-as-code build assets — browser DOM scripts, the Eleventy config,
# and Nunjucks templates — which are exercised by the site build rather than by
# unit tests, so the "coverage on new code" gate does not meaningfully apply.
sonar.coverage.exclusions=dac-configs/assets/scripts/**,dac-configs/eleventy.config.js,dac-configs/_includes/**
